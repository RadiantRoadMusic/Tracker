<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sanctuary Check In</title>
    <style>
        :root {
            --bg: #0f0f15;
            --card: #1a1a26;
            --card-hover: #1f1f2e;
            --accent: #048500;
            --accent-glow: #9ac65c;
            --accent-soft: rgba(4, 133, 0, 0.15);
            --accent-medium: rgba(4, 133, 0, 0.30);
            --text: #e8e8f2;
            --text-secondary: #ffffff;
            --text-muted: #ffffff;
            --success: #4ade80;
            --success-soft: rgba(74, 222, 128, 0.15);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.12);

            --radius: 18px;
            --radius-sm: 12px;

            --nav-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 16px 16px calc(var(--nav-height) + var(--safe-bottom) + 8px);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 4px 12px;
        }
        .brand-logo {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #048500, #588008);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(4, 133, 0, 0.35);
        }
        .brand-logo svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .brand-text .brand-name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text);
            line-height: 1.2;
        }

.streak-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-glow);
            margin-left: auto;
            flex-shrink: 0;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px;
        }
        .top-nav h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s, color 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
            max-width: none;
            box-shadow: 0 4px 20px rgba(4, 133, 0, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
            background: var(--accent-glow);
        }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }
        .btn-secondary:active {
            background: var(--card-hover);
        }
        .btn-sm {
            padding: 10px 18px;
            font-size: 0.85rem;
            border-radius: 20px;
        }
        .btn-ghost {
            background: transparent;
            color: var(--accent-glow);
            padding: 8px 12px;
            font-size: 0.85rem;
        }
        .btn-outline {
            background: transparent;
            color: var(--accent-glow);
            border: 1px solid var(--accent-medium);
            width: 100%;
        }
        .btn-outline:active {
            background: var(--accent-soft);
        }
        .checkin-prompt {
            text-align: center;
            padding: 26px 20px;
        }
        .checkin-prompt .time-badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent-glow);
            padding: 5px 13px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .checkin-prompt h2 {
            font-size: 1.25rem;
            margin-bottom: 6px;
        }
        .checkin-prompt p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 20px;
        }
        .rating-section {
            text-align: center;
            padding: 8px 0;
        }
        .rating-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .rating-big {
            font-size: 4rem;
            font-weight: 800;
            height: 80px;
            line-height: 80px;
            color: var(--accent-glow);
            transition: color 0.2s;
        }

.slider-container input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #4ade80, #a3e635, #fbbf24, #f97316, #f87171);
            outline: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
        }

.result-card {
            text-align: center;
            padding: 28px 20px;
        }
        .result-delta {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 8px 0;
        }
        .result-delta.reduced {
            color: var(--success);
        }
        .result-delta.neutral {
            color: var(--text-muted);
        }
        .result-delta.increased {
            color: var(--danger);
        }
        .result-msg {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .result-before-after {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 16px 0;
        }
        .ra-col {
            text-align: center;
        }
        .ra-val {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .ra-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .ra-arrow {
            font-size: 1.4rem;
            color: var(--text-muted);
            align-self: center;
        }
        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent);
        }
        .comment-area {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            resize: none;
            min-height: 80px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .comment-area::placeholder {
            color: var(--text-muted);
        }
        .comment-area:focus {
            outline: none;
            border-color: var(--accent);
        }
        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .pill {
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s, color 0.15s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill:active {
            transform: scale(0.96);
        }
        .pill.selected {
            background: var(--accent-soft);
            border-color: var(--accent-medium);
            color: var(--accent-glow);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .stat-sub {
            font-size: 0.72rem;
            color: var(--accent-glow);
            margin-top: 2px;
        }
        .chart-container {
            margin-top: 4px;
        }
        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .chart-date {
            width: 42px;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: right;
            flex-shrink: 0;
        }

.change-axis {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin: 0 42px 8px 50px;
        }
        .change-track {
            flex: 1;
            height: 22px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }
        .change-zero {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.22);
            z-index: 2;
        }
        .change-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            transition: width 0.5s ease;
        }
        .change-bar.good {
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }
        .change-bar.low {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }
        .change-value {
            width: 40px;
            text-align: right;
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .change-value.good {
            color: var(--success);
        }
        .change-value.low {
            color: var(--danger);
        }
        .change-count {
            width: 18px;
            text-align: right;
            flex-shrink: 0;
            font-size: 0.68rem;
            color: var(--text-muted);
        }
        .change-no-data {
            position: absolute;
            left: 8px;
            top: 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .chart-help {
            margin-top: 10px;
            font-size: 0.68rem;
            line-height: 1.4;
            color: var(--text-muted);
            text-align: center;
        }
        .weekly-card {
            background: var(--accent-soft);
            border: 1px solid var(--accent-medium);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 14px;
            text-align: center;
        }
        .weekly-card .msg {
            font-size: 0.88rem;
            color: var(--accent-glow);
            font-weight: 600;
        }
        .reminder-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-top: 14px;
            text-align: center;
        }
        .reminder-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 0.88rem;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .history-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 52px;
        }
        .history-scores {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .history-score {
            font-size: 0.9rem;
            font-weight: 700;
        }
        .history-arrow {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .history-delta {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }
        .history-delta.pos {
            color: var(--success);
            background: var(--success-soft);
        }
        .history-delta.neg {
            color: var(--danger);
            background: var(--danger-soft);
        }
        .history-delta.zero {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
        }
        .history-notes {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: auto;
            max-width: 90px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: var(--success);
            color: #000;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.4);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
        }
        .toast.error {
            background: var(--danger);
            color: #111;
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.4);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            background: rgba(15, 15, 21, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: var(--safe-bottom);
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 14px;
            transition: color 0.2s;
            font-family: inherit;
        }
        .nav-btn.active {
            color: var(--accent-glow);
        }
        .nav-btn svg {
            width: 22px;
            height: 22px;
        }
        .spacer {
            flex: 1;
        }
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .scroll-area {
            max-height: 340px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .step-indicator {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ─── FLUID RESPONSIVE LAYOUT ─────────────────────────────── */
        :root {
            --app-max: 780px;
            --page-pad: clamp(12px, 3.2vw, 28px);
            --top-pad: clamp(12px, 2.5vw, 24px);
            --card-pad: clamp(16px, 2.6vw, 24px);
            --section-gap: clamp(10px, 1.8vw, 16px);
            --control-height: clamp(46px, 6vw, 52px);
            --nav-height: clamp(64px, 8vw, 74px);
            --radius: clamp(15px, 2vw, 20px);
            --radius-sm: clamp(11px, 1.5vw, 14px);
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .app {
            width: min(100%, var(--app-max));
            max-width: var(--app-max);
            min-height: 100vh;
            min-height: 100dvh;
            padding:
                max(var(--top-pad), env(safe-area-inset-top, 0px))
                var(--page-pad)
                calc(var(--nav-height) + var(--safe-bottom) + clamp(18px, 3vw, 30px));
        }

        .brand-header {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: clamp(10px, 2vw, 16px);
            padding: clamp(2px, 1vw, 8px) clamp(0px, 0.5vw, 4px) clamp(10px, 2vw, 16px);
            min-width: 0;
        }

        .brand-logo {
            width: clamp(42px, 6.5vw, 50px);
            height: clamp(42px, 6.5vw, 50px);
            border-radius: clamp(12px, 1.8vw, 15px);
        }

        .brand-logo svg {
            width: clamp(22px, 3.5vw, 27px);
            height: clamp(22px, 3.5vw, 27px);
        }

        .brand-text {
            min-width: 0;
            align-self: center;
        }

        .brand-text .brand-name {
            font-size: clamp(1.02rem, 1.5vw + 0.72rem, 1.28rem);
            overflow-wrap: anywhere;
        }

.streak-pill {
            gap: clamp(4px, 1vw, 7px);
            padding: clamp(6px, 1vw, 8px) clamp(10px, 1.8vw, 15px);
            font-size: clamp(0.74rem, 0.5vw + 0.65rem, 0.86rem);
            white-space: nowrap;
            align-self: center;
        }

        .top-nav {
            gap: clamp(8px, 1.7vw, 14px);
            padding: clamp(5px, 1vw, 9px) clamp(0px, 0.5vw, 4px) clamp(12px, 2vw, 18px);
            min-width: 0;
        }

        .top-nav h1 {
            font-size: clamp(1.18rem, 1.15vw + 0.95rem, 1.5rem);
            line-height: 1.2;
            min-width: 0;
        }

        .card {
            padding: var(--card-pad);
            margin-bottom: var(--section-gap);
        }

        .card-title {
            font-size: clamp(0.72rem, 0.22vw + 0.68rem, 0.8rem);
            margin-bottom: clamp(10px, 1.5vw, 14px);
        }

        .btn {
            min-height: var(--control-height);
            padding: clamp(11px, 1.7vw, 15px) clamp(18px, 3vw, 30px);
            border-radius: 999px;
            font-size: clamp(0.94rem, 0.35vw + 0.88rem, 1.02rem);
            line-height: 1.15;
        }

        .btn-sm {
            min-height: 42px;
            padding: clamp(9px, 1.2vw, 11px) clamp(13px, 2vw, 19px);
            font-size: clamp(0.8rem, 0.3vw + 0.75rem, 0.88rem);
        }

        .btn-ghost {
            padding-inline: clamp(10px, 1.6vw, 14px);
        }

        .checkin-prompt {
            padding: clamp(22px, 4vw, 34px) var(--card-pad);
        }

        .checkin-prompt .time-badge {
            padding: clamp(5px, 0.8vw, 7px) clamp(11px, 1.8vw, 15px);
            font-size: clamp(0.75rem, 0.25vw + 0.71rem, 0.8rem);
            margin-bottom: clamp(13px, 2vw, 18px);
        }

        .checkin-prompt h2 {
            font-size: clamp(1.18rem, 1vw + 0.98rem, 1.42rem);
            margin-bottom: clamp(6px, 1vw, 9px);
        }

        .checkin-prompt p,
        .empty-state p {
            font-size: clamp(0.86rem, 0.3vw + 0.81rem, 0.94rem);
            line-height: 1.5;
        }

        .rating-section {
            padding: clamp(8px, 1.5vw, 14px) 0;
        }

        .rating-label {
            padding-inline: clamp(6px, 1vw, 12px);
            font-size: clamp(0.88rem, 0.35vw + 0.82rem, 0.96rem);

            box-shadow: 0 7px 22px rgba(4, 133, 0, 0.20);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-primary:hover {
                filter: brightness(1.04);
            }
            .btn-secondary:hover,
            .pill:hover {
                background-color: var(--card-hover);
            }
            .btn-ghost:hover,
            .nav-btn:hover {
                color: var(--text);
            }
        }

        /* Shared slider geometry. Endpoint words sit directly beside their numbers,
           while 0 / 5 / 10 remain aligned to the slider's true positions. */
        .slider-container {
            padding-inline: var(--slider-side-pad);
        }

        .slider-container input[type="range"] {
            display: block;
            margin: 0;
        }

        .slider-container input[type="range"]::-moz-range-track {
            height: 8px;
            border: 0;
            border-radius: 4px;
            background: linear-gradient(to right, #4ade80, #a3e635, #fbbf24, #f97316, #f87171);
        }

        .slider-labels {
            position: relative;
            display: block;
            width: auto;
            height: 18px;
            margin: var(--slider-label-gap) var(--slider-side-pad) 0;
            padding: 0;
            font-size: clamp(0.75rem, 0.25vw + 0.71rem, 0.82rem);
            font-weight: 600;
            line-height: 1;
            color: var(--text-secondary);
        }

        .scale-end {
            position: absolute;
            top: 50%;
            display: flex;
            align-items: center;
            gap: clamp(3px, 0.6vw, 5px);
            white-space: nowrap;
            transform: translateY(-50%);
        }

        .scale-end-left {
            left: 0;
        }

        .scale-end-right {
            right: 0;
        }

        .slider-labels .scale-num {
            color: var(--text);
            font-size: clamp(0.88rem, 0.25vw + 0.84rem, 0.96rem);
            font-weight: 750;
            letter-spacing: 0;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* Offset only the endpoint number visually, so its centre stays on the track endpoint
           while the word can sit immediately beside it. */
        .scale-end-left .scale-num {
            transform: translateX(-50%);
            margin-right: -0.5ch;
        }

        .scale-end-right .scale-num {
            transform: translateX(50%);
            margin-left: -1ch;
        }

        .slider-labels .scale-mid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .slider-labels .scale-word {
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .history-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .history-nav .btn {
            justify-self: start;
        }

        .history-nav h1 {
            justify-self: center;
            font-size: clamp(1.1rem, 1vw + 0.9rem, 1.3rem);
            white-space: nowrap;
        }

        .history-nav-balance {
            width: 1px;
            justify-self: end;
        }

        .bottom-nav {
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 340px) {
            :root {
                --slider-side-pad: 10px;
            }
            .slider-labels {
                font-size: 0.70rem;
            }
            .slider-labels .scale-num {
                font-size: 0.84rem;
            }
        }

        @media (max-height: 650px) {
            :root {
                --slider-label-gap: 20px;
            }
        }

        @media (max-height: 520px) {
            :root {
                --slider-label-gap: 16px;
            }
        }

    </style>
</head>
<body>
    <div class="app" id="app"></div>

    <script>
        const STORAGE_KEY = 'nstrk_data';
        const PENDING_KEY = 'nstrk_pending';
        const DATA_VERSION = 3;
        const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
        const MAX_CHECKINS = 50000;
        const MAX_RESTORE_BYTES = 10 * 1024 * 1024;
        const VALID_SCREENS = new Set(['home', 'before', 'after', 'notes', 'result', 'dashboard', 'history']);
        const LOCKED_SCREENS = new Set(['home', 'before', 'after', 'result']);
        const LIVE_DATA_SCREENS = new Set(['home', 'dashboard', 'history']);
        const TOUCH_OPTIONS = new Set(['Hands', 'Face', 'Arms', 'All of the above']);
        const SCALE_LABELS = `<div class="slider-labels"><span class="scale-end scale-end-left"><strong class="scale-num">0</strong><span class="scale-word">😌 Calm</span></span><strong class="scale-num scale-mid">5</strong><span class="scale-end scale-end-right"><span class="scale-word">Stressed 😰</span><strong class="scale-num">10</strong></span></div>`;
        const app = document.getElementById('app');

        let lastStoredJSON = null;
        let lastPendingJSON = null;
        let pendingSaveTimer = null;
        let D = load();
        let pending = loadPending();
        let isSaving = false;
        let currentScreen = 'home';
        let closeActiveConfirm = null;

        // ─── DATA SAFETY & NORMALIZATION ────────────────────────────
        function isPlainObject(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
        }

        function isValidDateStr(value) {
            if (typeof value !== 'string' || !DATE_RE.test(value)) return false;
            const [y, m, d] = value.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
        }

        function isValidScore(value) {
            return Number.isInteger(value) && value >= 0 && value <= 10;
        }

        function normalizeString(value, maxLength = 5000) {
            return typeof value === 'string' ? value.slice(0, maxLength) : '';
        }

        function makeId() {
            if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
                return globalThis.crypto.randomUUID();
            }
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        }

        function ensureUniqueCheckinIds(checkins) {
            const seen = new Set();
            return checkins.map((c, index) => {
                let id = c.id || `legacy-${c.date}-${index}`;
                if (seen.has(id)) {
                    const base = id.slice(0, 80);
                    let suffix = 2;
                    while (seen.has(`${base}-dup-${suffix}`)) suffix += 1;
                    id = `${base}-dup-${suffix}`;
                }
                seen.add(id);
                return id === c.id ? c : { ...c, id };
            });
        }

        function normalizeCreatedAt(value, date, fallbackIndex = 0) {
            if (typeof value === 'string') {
                const parsedMs = Date.parse(value);
                if (Number.isFinite(parsedMs)) return new Date(parsedMs).toISOString();
            }
            const fallback = dateFromStr(date);
            fallback.setHours(12, 0, 0, Math.min(Math.max(fallbackIndex, 0), 999));
            return fallback.toISOString();
        }

        function validateCheckin(raw, fallbackIndex = 0) {
            if (!isPlainObject(raw)) return null;
            if (!isValidDateStr(raw.date)) return null;
            if (!isValidScore(raw.before) || !isValidScore(raw.after)) return null;

            return {
                id: typeof raw.id === 'string' && raw.id
                    ? raw.id.slice(0, 100)
                    : `legacy-${raw.date}-${fallbackIndex}`,
                createdAt: normalizeCreatedAt(raw.createdAt, raw.date, fallbackIndex),
                date: raw.date,
                time: normalizeString(raw.time, 40),
                period: normalizeString(raw.period, 20),
                before: raw.before,
                after: raw.after,
                song: normalizeString(raw.song, 300),
                touch: normalizeString(raw.touch, 300),
                comment: normalizeString(raw.comment, 5000)
            };
        }

        function sortCheckins(checkins) {
            return [...checkins].sort((a, b) => {
                const parsedA = Date.parse(a.createdAt || '');
                const parsedB = Date.parse(b.createdAt || '');
                const ta = Number.isFinite(parsedA) ? parsedA : dateFromStr(a.date).getTime();
                const tb = Number.isFinite(parsedB) ? parsedB : dateFromStr(b.date).getTime();
                if (ta !== tb) return ta - tb;
                return String(a.id).localeCompare(String(b.id));
            });
        }

        function calculateStreak(checkins) {
            const today = localDateStr();
            const uniqueDates = [...new Set(checkins.map(c => c.date).filter(d => isValidDateStr(d) && d <= today))].sort();
            if (uniqueDates.length === 0) {
                return { current: 0, lastDate: null, longest: 0 };
            }

            let longest = 1;
            let run = 1;
            for (let i = 1; i < uniqueDates.length; i++) {
                const prev = dateFromStr(uniqueDates[i - 1]);
                const curr = dateFromStr(uniqueDates[i]);
                const diff = calendarDayDiff(prev, curr);
                if (diff === 1) {
                    run += 1;
                    longest = Math.max(longest, run);
                } else {
                    run = 1;
                }
            }

            const lastDate = uniqueDates[uniqueDates.length - 1];
            const yesterday = shiftDateStr(today, -1);
            let current = 0;

            if (lastDate === today || lastDate === yesterday) {
                current = 1;
                for (let i = uniqueDates.length - 1; i > 0; i--) {
                    const newer = dateFromStr(uniqueDates[i]);
                    const older = dateFromStr(uniqueDates[i - 1]);
                    if (calendarDayDiff(older, newer) === 1) current += 1;
                    else break;
                }
            }

            return { current, lastDate, longest };
        }

        function normalizeData(raw) {
            const source = isPlainObject(raw) ? raw : {};
            const checkins = Array.isArray(source.checkins)
                ? source.checkins.slice(0, MAX_CHECKINS).map((item, index) => validateCheckin(item, index)).filter(Boolean)
                : [];
            const sorted = sortCheckins(ensureUniqueCheckinIds(checkins));
            const meta = isPlainObject(source.meta) ? source.meta : {};

            return {
                version: DATA_VERSION,
                checkins: sorted,
                streak: calculateStreak(sorted),
                meta: {
                    lastBackupReminderAt: Number.isInteger(meta.lastBackupReminderAt) && meta.lastBackupReminderAt >= 0
                        ? meta.lastBackupReminderAt
                        : 0
                }
            };
        }

        function emptyData() {
            return {
                version: DATA_VERSION,
                checkins: [],
                streak: { current: 0, lastDate: null, longest: 0 },
                meta: { lastBackupReminderAt: 0 }
            };
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                lastStoredJSON = raw;
                if (raw) return normalizeData(JSON.parse(raw));
            } catch (e) {
                console.error('Could not load Sanctuary Check In data:', e);
            }
            return emptyData();
        }

        function readStoredData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw === lastStoredJSON) return D;
                const latest = raw ? normalizeData(JSON.parse(raw)) : emptyData();
                lastStoredJSON = raw;
                return latest;
            } catch (e) {
                console.warn('Could not read latest Sanctuary Check In data:', e);
                return null;
            }
        }

        function syncDataFromStorage() {
            const latest = readStoredData();
            if (latest) D = latest;
            return Boolean(latest);
        }

        function save() {
            try {
                D.version = DATA_VERSION;
                const serialized = JSON.stringify(D);
                localStorage.setItem(STORAGE_KEY, serialized);
                lastStoredJSON = serialized;
                return true;
            } catch (e) {
                console.error('Could not save Sanctuary Check In data:', e);
                return false;
            }
        }

        function refreshDerivedData() {
            D.checkins = sortCheckins(D.checkins);
            D.streak = calculateStreak(D.checkins);
        }

        // ─── UNFINISHED CHECK-IN RECOVERY ──────────────────────────
        function emptyPending() {
            return {
                id: null,
                before: null,
                after: null,
                song: '',
                touch: [],
                comment: '',
                step: 'before',
                startedAt: null
            };
        }

        function normalizePending(raw) {
            if (!isPlainObject(raw)) return emptyPending();
            let touch = Array.isArray(raw.touch)
                ? raw.touch.filter(v => TOUCH_OPTIONS.has(v))
                : [];
            touch = touch.includes('All of the above') ? ['All of the above'] : [...new Set(touch)].slice(0, 3);
            const startedAt = typeof raw.startedAt === 'string' && Number.isFinite(Date.parse(raw.startedAt))
                ? new Date(raw.startedAt).toISOString()
                : null;
            return {
                id: typeof raw.id === 'string' && raw.id
                    ? raw.id.slice(0, 100)
                    : (startedAt ? `draft-${startedAt}`.slice(0, 100) : null),
                before: isValidScore(raw.before) ? raw.before : null,
                after: isValidScore(raw.after) ? raw.after : null,
                song: normalizeString(raw.song, 300),
                touch,
                comment: normalizeString(raw.comment, 5000),
                step: ['before', 'after', 'notes'].includes(raw.step) ? raw.step : 'before',
                startedAt
            };
        }

        function loadPending() {
            try {
                const raw = localStorage.getItem(PENDING_KEY);
                lastPendingJSON = raw;
                if (raw) return normalizePending(JSON.parse(raw));
            } catch (e) {
                console.warn('Could not load unfinished check-in:', e);
            }
            return emptyPending();
        }

        function savePending() {
            if (pendingSaveTimer) {
                clearTimeout(pendingSaveTimer);
                pendingSaveTimer = null;
            }
            try {
                if (!pending.startedAt) return clearPending();
                const serialized = JSON.stringify(pending);
                if (serialized === lastPendingJSON) return true;
                localStorage.setItem(PENDING_KEY, serialized);
                lastPendingJSON = serialized;
                return true;
            } catch (e) {
                console.warn('Could not save unfinished check-in:', e);
                return false;
            }
        }

        function clearPending() {
            if (pendingSaveTimer) {
                clearTimeout(pendingSaveTimer);
                pendingSaveTimer = null;
            }
            pending = emptyPending();
            lastPendingJSON = null;
            try {
                localStorage.removeItem(PENDING_KEY);
                return localStorage.getItem(PENDING_KEY) === null;
            } catch (e) {
                console.warn('Could not clear unfinished check-in:', e);
                return false;
            }
        }

        function queuePendingSave() {
            if (pendingSaveTimer) clearTimeout(pendingSaveTimer);
            pendingSaveTimer = setTimeout(() => {
                pendingSaveTimer = null;
                savePending();
            }, 120);
        }

        function hasPending() {
            return Boolean(pending.startedAt);
        }

        function escHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function csvCell(value) {
            let s = String(value ?? '');
            if (/^[\s\u200B\u200C\u200D\uFEFF]*[=+\-@]/.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        }

        // ─── LOCAL DATE / TIME HELPERS ──────────────────────────────
        function localDateStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        function ts() {
            return localDateStr();
        }

        function now() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function dateFromStr(d) {
            const parts = d.split('-');
            return new Date(+parts[0], +parts[1] - 1, +parts[2], 12, 0, 0, 0);
        }

        function calendarDayDiff(older, newer) {
            const a = Date.UTC(older.getFullYear(), older.getMonth(), older.getDate());
            const b = Date.UTC(newer.getFullYear(), newer.getMonth(), newer.getDate());
            return Math.round((b - a) / 86400000);
        }

        function shiftDateStr(dateStr, amount) {
            const d = dateFromStr(dateStr);
            d.setDate(d.getDate() + amount);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function fmt(d) {
            return dateFromStr(d).toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function fmtFull(d) {
            return dateFromStr(d).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function period() {
            const h = new Date().getHours();
            return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
        }

        function weekRange() {
            const n = new Date();
            const day = n.getDay();
            const start = new Date(n);
            start.setDate(n.getDate() - ((day + 6) % 7));
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            return {
                start: start.getFullYear() + '-' + String(start.getMonth() + 1).padStart(2, '0') + '-' + String(start.getDate()).padStart(2, '0'),
                end: end.getFullYear() + '-' + String(end.getMonth() + 1).padStart(2, '0') + '-' + String(end.getDate()).padStart(2, '0')
            };
        }

        function formatChange(value) {
            if (value === 0) return '0.0';
            return (value > 0 ? '+' : '−') + Math.abs(value).toFixed(1);
        }

        // ─── RENDERING ──────────────────────────────────────────────
        function r(s, data) {
            if (!app) return;

            let nextScreen = VALID_SCREENS.has(s) ? s : 'home';
            if (nextScreen === 'after' && !isValidScore(pending.before)) nextScreen = 'before';
            if (nextScreen === 'notes') {
                if (!isValidScore(pending.before)) nextScreen = 'before';
                else if (!isValidScore(pending.after)) nextScreen = 'after';
            }
            if (nextScreen === 'result' && (
                !isPlainObject(data) || !isValidScore(data.before) || !isValidScore(data.after) || !isValidDateStr(data.date)
            )) {
                nextScreen = 'home';
                data = undefined;
            }

            currentScreen = nextScreen;
            app.className = 'app screen-' + currentScreen;
            document.body.classList.toggle('lock-scroll', LOCKED_SCREENS.has(currentScreen));
            app.innerHTML = renderScreen(currentScreen, data);
            app.classList.toggle('has-pending', currentScreen === 'home' && hasPending());

            const textarea = app.querySelector('.comment-area');
            if (textarea) autoResize(textarea);
        }

        function renderScreen(s, d) {
            switch (s) {
                case 'home': return homeUI();
                case 'before': return beforeUI();
                case 'after': return afterUI();
                case 'notes': return notesUI();
                case 'result': return resultUI(d);
                case 'dashboard': return dashUI();
                case 'history': return histUI();
                default: return homeUI();
            }
        }

        function nav(active) {
            const current = key => active === key ? 'page' : 'false';
            return `<nav class="bottom-nav" aria-label="Primary navigation">
            <button type="button" class="nav-btn ${active === 'home' ? 'active' : ''}" onclick="r('home')" aria-label="Home" aria-current="${current('home')}">🏠<span>Home</span></button>
            <button type="button" class="nav-btn ${active === 'checkin' ? 'active' : ''}" onclick="start()" aria-label="Check-in" aria-current="${current('checkin')}">✍️<span>Check-in</span></button>
            <button type="button" class="nav-btn ${active === 'dashboard' ? 'active' : ''}" onclick="r('dashboard')" aria-label="Progress" aria-current="${current('dashboard')}">📊<span>Progress</span></button>
            <button type="button" class="nav-btn ${active === 'history' ? 'active' : ''}" onclick="r('history')" aria-label="History" aria-current="${current('history')}">📋<span>History</span></button>
          </nav>`;
        }

        function backupReminderUI(returnScreen = 'home') {
            const total = D.checkins.length;
            const threshold = Math.floor(total / 25) * 25;
            if (threshold < 25 || D.meta.lastBackupReminderAt >= threshold) return '';
            return `<div class="weekly-card backup-reminder fade-in">
                <div class="msg">💾 You have ${total} check-ins — this is a good time to make a backup.</div>
                <div class="action-row">
                    <button class="btn btn-outline btn-sm" onclick="backupData()">Backup now</button>
                    <button class="btn btn-ghost btn-sm" onclick="dismissBackupReminder('${returnScreen}')">Not now</button>
                </div>
            </div>`;
        }

        function pendingUI() {
            if (!hasPending()) return '';
            const started = new Date(pending.startedAt);
            const startedText = Number.isNaN(started.getTime()) ? '' : started.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `<div class="weekly-card pending-reminder fade-in">
                <div class="msg">✍️ You have an unfinished check-in${startedText ? ' from ' + escHTML(startedText) : ''}.</div>
                <div class="action-row">
                    <button class="btn btn-primary btn-sm" onclick="resumeCheckin()">Resume</button>
                    <button class="btn btn-ghost btn-sm" type="button" onclick="startNewCheckin()">Start New Check-in</button>
                </div>
            </div>`;
        }

        function homeUI() {
            if (!syncDataFromStorage()) refreshDerivedData();
            const today = ts();
            const s = D.streak;
            const todayC = D.checkins.reduce((count, c) => count + (c.date === today ? 1 : 0), 0);
            const dayPeriod = period();
            const emoji = dayPeriod === 'Morning' ? '🌅' : dayPeriod === 'Afternoon' ? '☀️' : '🌙';
            const hasDraft = hasPending();
            const pendingBlock = hasDraft ? pendingUI() : '';
            return `
          <div class="brand-header fade-in">
            <div class="brand-logo">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </div>
            <div class="brand-text">
              <div class="brand-name">Sanctuary Check In</div>
              <div class="brand-sub"></div>
            </div>
            <div class="streak-pill">🔥 ${s.current} day streak</div>
          </div>
          ${pendingBlock}
          <div class="card checkin-prompt fade-in">
            <div class="time-badge">${emoji} ${dayPeriod} Check-in</div>
            <h2>How are you feeling?</h2>
            <p>Rate your stress before and after your session.</p>
            <button class="btn btn-primary" type="button" onclick="start()">${hasDraft ? 'Resume Check-in' : 'Start Check-in'}</button>
            ${todayC > 0 ? `<p class="today-count">${todayC} check-in${todayC > 1 ? 's' : ''} today so far${todayC < 2 ? ' — aim for at least 2' : ''}</p>` : ''}
          </div>
          <div class="reminder-card fade-in"><p>💡 Building lasting calm takes time. Small, consistent sessions build the foundation. Showing up is the win.</p></div>
          ${nav('home')}`;
        }

        function stepNav(backAction, step) {
            return `<div class="top-nav fade-in">
            <button type="button" class="btn btn-ghost btn-sm" onclick="${backAction}()">← Back</button>
            <div class="spacer"></div><span class="step-indicator">Step ${step} of 3</span>
          </div>`;
        }

        function ratingCard(field, label, value) {
            const labelId = field + 'Label';
            const valueId = field + 'Val';
            const sliderId = field + 'Slider';
            return `<div class="card rating-section fade-in">
            <div class="rating-label" id="${labelId}">${label}</div>
            <div class="rating-big" id="${valueId}">${value}</div>
            <div class="slider-container">
              <input type="range" min="0" max="10" value="${value}" id="${sliderId}" aria-labelledby="${labelId}" oninput="updatePendingRating('${field}','${valueId}',this.value)">
            </div>
            ${SCALE_LABELS}
          </div>`;
        }

        function beforeUI() {
            const value = isValidScore(pending.before) ? pending.before : 5;
            return `${stepNav('goHomeFromCheckin', 1)}
          ${ratingCard('before', 'How stressed / overwhelmed are you right now?', value)}
          <button type="button" class="btn btn-primary mt-8" onclick="doBefore()">Continue →</button>
          ${nav('checkin')}`;
        }

        function afterUI() {

            if (!el) return;

        function dashUI() {
            if (!syncDataFromStorage()) refreshDerivedData();
            const today = ts();
            const s = D.streak;
            const all = D.checkins;
            const wk = weekRange();

            const last7Dates = [];
            const daily = new Map();
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                last7Dates.push(ds);
                daily.set(ds, { sum: 0, count: 0 });
            }

            let todayC = 0;
            let totalReductions = 0;
            let weeklyChangeSum = 0;
            let weeklyCount = 0;
            const weeklyByDay = new Map();

            for (const c of all) {
                if (c.date === today) todayC += 1;
                if (c.before > c.after) totalReductions += 1;

                if (c.date >= wk.start && c.date <= wk.end && c.date <= today) {
                    weeklyCount += 1;
                    weeklyChangeSum += c.after - c.before;
                    weeklyByDay.set(c.date, (weeklyByDay.get(c.date) || 0) + 1);
                }

                const day = daily.get(c.date);
                if (day) {
                    day.sum += c.after - c.before;
                    day.count += 1;
                }
            }

            const targetProgress = [...weeklyByDay.values()].reduce((sum, count) => sum + Math.min(count, 2), 0);
            const avgChange = weeklyCount ? weeklyChangeSum / weeklyCount : null;
            const total = all.length;
            const last7 = last7Dates.map(date => {
                const day = daily.get(date);
                return {
                    date,
                    label: fmt(date),
                    avg: day.count ? day.sum / day.count : null,
                    count: day.count
                };
            });

            let wkMsg = '';
            if (targetProgress >= 14) {
                wkMsg = '🎉 Amazing! You reached your 14 check-in consistency target this week. That consistency is worth celebrating.';
            } else if (targetProgress >= 10) {
                wkMsg = `💪 Great consistency! ${14 - targetProgress} more check-ins to reach this week's target.`;
            } else if (targetProgress >= 5) {
                wkMsg = `🌱 Building momentum — ${targetProgress} of 14 consistency check-ins this week. Keep giving the practice time to become familiar.`;
            } else if (targetProgress > 0) {
                wkMsg = `🌱 ${targetProgress} of 14 consistency check-ins this week. Up to 2 per day count toward this target.`;
            } else {
                wkMsg = 'A new week begins. Aim for at least 2 check-ins a day and let consistency build gradually.';

            return `

            <h1>Your Progress</h1>
            <button type="button" class="btn btn-ghost btn-sm" onclick="exportCSV()">📤 Export</button>

            <input type="file" id="restoreFile" accept=".json,application/json" class="visually-hidden-file" onchange="restoreData(this)">
          </div>
          ${wkMsg ? `<div class="weekly-card fade-in"><div class="msg">${wkMsg}</div></div>` : ''}
          ${backupReminderUI('dashboard')}
          <div class="stat-grid fade-in">
            <div class="stat-card"><div class="stat-value">${s.current}</div><div class="stat-label">Day Streak</div><div class="stat-sub">Best: ${s.longest}</div></div>
            <div class="stat-card"><div class="stat-value">${todayC}</div><div class="stat-label">Today</div><div class="stat-sub">${todayC >= 2 ? '✅ Target hit' : 'Min target: 2'}</div></div>
            <div class="stat-card"><div class="stat-value">${avgChange === null ? '—' : formatChange(avgChange)}</div><div class="stat-label">Avg Change</div><div class="stat-sub">This week · ${weeklyCount} entries</div></div>
            <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total Check-ins</div><div class="stat-sub">${totalReductions} showed improvement</div></div>
          </div>
          <div class="card fade-in mt-12">
            <div class="card-title">Last 7 Days — Avg Stress Change</div>
            <div class="change-axis"><span>Higher stress ←</span><span>Lower stress →</span></div>
            <div class="chart-container">
              ${last7.map(d => {
                if (d.avg === null) {
                    return `<div class="chart-bar-row"><div class="chart-date">${d.label}</div><div class="change-track"><div class="change-zero"></div><span class="change-no-data">No data</span></div><span class="change-value">—</span></div>`;
                }
                const v = d.avg;
                const pct = Math.min(Math.abs(v) / 10 * 50, 50);
                const bar = v === 0
                    ? ''
                    : `<div class="change-bar ${v < 0 ? 'good' : 'low'}" style="${v < 0 ? 'left:50%;' : 'right:50%;'}width:${pct}%;"></div>`;
                return `<div class="chart-bar-row"><div class="chart-date">${d.label}</div><div class="change-track"><div class="change-zero"></div>${bar}</div><span class="change-value ${v < 0 ? 'good' : v > 0 ? 'low' : ''}">${formatChange(v)}</span><span class="change-count">${d.count}</span></div>`;
              }).join('')}
            </div>
            <p class="chart-help">Negative numbers mean stress was lower after the session; positive numbers mean it was higher.</p>
          </div>
          <div class="reminder-card fade-in"><p>💡 Progress is not always linear. Some days you'll notice a bigger shift; other days, showing up and noticing how you feel is enough.</p></div>
          ${nav('dashboard')}`;
        }

        // ─── EXPORT / BACKUP / RESTORE ──────────────────────────────
        function exportCSV() {
            try {
                syncDataFromStorage();
                const rows = D.checkins.map(c => [
                    csvCell(c.date),
                    csvCell(c.time),
                    csvCell(c.period),
                    c.before,
                    c.after,
                    c.before - c.after,
                    csvCell(c.song),
                    csvCell(c.touch),
                    csvCell(c.comment),
                    csvCell(c.createdAt)
                ].join(','));
                const csv = '\uFEFFDate,Time,Period,Before,After,Reduction,Song,Sanctuary Touch Techniques,Notes,Created At\n' + rows.join('\n');

                showToast('❌ CSV export failed.', true);

        function downloadBlob(contents, type, filename) {
            const blob = new Blob([contents], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function showToast(msg, isError = false) {
            document.querySelectorAll('.toast').forEach(existing => existing.remove());
            const t = document.createElement('div');
            t.className = 'toast' + (isError ? ' error' : '');
            t.textContent = msg;
            t.setAttribute('role', isError ? 'alert' : 'status');
            t.setAttribute('aria-live', isError ? 'assertive' : 'polite');
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2400);
        }

        function currentBackupThreshold() {
            return Math.floor(D.checkins.length / 25) * 25;
        }

        function dismissBackupReminder(returnScreen = 'home') {
            syncDataFromStorage();
            const previous = D.meta.lastBackupReminderAt;
            D.meta.lastBackupReminderAt = Math.max(previous, currentBackupThreshold());
            if (!save()) {
                D.meta.lastBackupReminderAt = previous;
                showToast('❌ Could not save that preference.', true);
                return;
            }
            r(returnScreen === 'dashboard' ? 'dashboard' : 'home');
        }

        function backupData() {
            try {
                if (!syncDataFromStorage()) refreshDerivedData();
                D.version = DATA_VERSION;
                const dataClone = JSON.parse(JSON.stringify(D));
                downloadBlob(
                    JSON.stringify(dataClone, null, 2),
                    'application/json',
                    'sanctuary-check-in-backup-' + ts() + '.json'
                );
                D.meta.lastBackupReminderAt = Math.max(D.meta.lastBackupReminderAt, currentBackupThreshold());
                if (!save()) console.warn('Backup downloaded, but backup-reminder state could not be saved.');
                showToast('💾 Backup saved! Keep this file safe.');
            } catch (e) {
                console.error('Backup failed:', e);
                showToast('❌ Backup failed.', true);
            }
        }

        function validateRestorePayload(raw) {
            if (!isPlainObject(raw) || !Array.isArray(raw.checkins)) {
                throw new Error('Invalid Sanctuary backup format');
            }
            if (Number.isInteger(raw.version) && raw.version > DATA_VERSION) {
                throw new Error('This backup was created by a newer version of Sanctuary Check In');
            }
            if (raw.checkins.length > MAX_CHECKINS) {
                throw new Error('Backup contains too many check-ins');
            }

            const invalidCount = raw.checkins.reduce((count, item, index) => count + (validateCheckin(item, index) ? 0 : 1), 0);
            if (invalidCount > 0) {
                throw new Error(invalidCount + ' invalid check-in' + (invalidCount === 1 ? '' : 's') + ' found');
            }

            return normalizeData(raw);
        }

        function showConfirmDialog({ title, message, confirmText = 'Confirm', danger = false }) {
            if (typeof closeActiveConfirm === 'function') closeActiveConfirm(false);

            return new Promise(resolve => {
                const previouslyFocused = document.activeElement;
                const backdrop = document.createElement('div');
                backdrop.className = 'confirm-backdrop';

                const panel = document.createElement('div');
                panel.className = 'confirm-dialog';
                panel.setAttribute('role', 'dialog');
                panel.setAttribute('aria-modal', 'true');

                const titleId = 'confirmTitle-' + makeId();
                panel.setAttribute('aria-labelledby', titleId);

                const heading = document.createElement('h2');
                heading.id = titleId;
                heading.textContent = title;

                const body = document.createElement('p');
                body.textContent = message;

                const actions = document.createElement('div');
                actions.className = 'confirm-actions';

                const cancel = document.createElement('button');
                cancel.type = 'button';
                cancel.className = 'btn btn-secondary';
                cancel.textContent = 'Cancel';

                const confirmButton = document.createElement('button');
                confirmButton.type = 'button';
                confirmButton.className = 'btn btn-primary' + (danger ? ' btn-danger' : '');
                confirmButton.textContent = confirmText;

                actions.append(cancel, confirmButton);
                panel.append(heading, body, actions);
                backdrop.appendChild(panel);
                document.body.appendChild(backdrop);

                let settled = false;
                const finish = value => {
                    if (settled) return;
                    settled = true;
                    document.removeEventListener('keydown', onKeyDown);
                    backdrop.remove();
                    closeActiveConfirm = null;
                    if (previouslyFocused && typeof previouslyFocused.focus === 'function' && previouslyFocused.isConnected) {
                        previouslyFocused.focus();
                    }
                    resolve(value);
                };
                closeActiveConfirm = finish;

                const onKeyDown = event => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        finish(false);
                        return;
                    }
                    if (event.key !== 'Tab') return;
                    const focusable = [cancel, confirmButton];
                    const index = focusable.indexOf(document.activeElement);
                    if (event.shiftKey && (index <= 0)) {
                        event.preventDefault();
                        confirmButton.focus();
                    } else if (!event.shiftKey && index === focusable.length - 1) {
                        event.preventDefault();
                        cancel.focus();
                    }
                };

                cancel.addEventListener('click', () => finish(false), { once: true });
                confirmButton.addEventListener('click', () => finish(true), { once: true });
                backdrop.addEventListener('click', event => {
                    if (event.target === backdrop) finish(false);
                });
                document.addEventListener('keydown', onKeyDown);
                requestAnimationFrame(() => confirmButton.focus());
            });
        }

        function restoreData(input) {
            const file = input.files && input.files[0];
            if (!file) return;

            if (file.size > MAX_RESTORE_BYTES) {
                showToast('❌ Backup file is too large.', true);
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    const restored = validateRestorePayload(json);
                    const approved = await showConfirmDialog({
                        title: 'Restore backup?',
                        message: 'Restore ' + restored.checkins.length + ' check-ins with a ' + restored.streak.current +
                            '-day current streak? This will replace all current saved check-ins.',
                        confirmText: 'Restore',
                        danger: true
                    });
                    if (!approved) return;

                    const oldD = D;
                    D = restored;
                    if (!save()) {
                        D = oldD;
                        throw new Error('Browser storage is unavailable or full');
                    }

                    clearPending();
                    showToast('✅ Data restored! Reloading…');
                    setTimeout(() => location.reload(), 700);
                } catch (err) {
                    console.error('Restore failed:', err);
                    showToast('❌ Invalid backup file: ' + err.message, true);
                } finally {
                    input.value = '';
                }
            };
            reader.onerror = function() {
                showToast('❌ Could not read backup file.', true);
                input.value = '';
            };
            reader.readAsText(file);
        }

        // ─── CHECK-IN FLOW ──────────────────────────────────────────
        function start() {
            if (hasPending()) {
                resumeCheckin();
                return;
            }
            startFresh();
        }

        function startFresh() {
            isSaving = false;
            pending = emptyPending();
            pending.id = makeId();
            pending.before = 5;
            pending.step = 'before';
            pending.startedAt = new Date().toISOString();
            if (!savePending()) {
                console.warn('Unfinished-check-in recovery is unavailable in this browser session.');
            }
            r('before');
        }

        function startNewCheckin() {
            clearPending();
            startFresh();
        }

        function resumeCheckin() {
            if (!hasPending()) {
                startFresh();
                return;
            }

            if (pending.step === 'before') {
                r('before');
                return;
            }

            if (pending.step === 'after') {
                if (!isValidScore(pending.before)) {
                    pending.step = 'before';
                    savePending();
                    r('before');
                    return;
                }
                r('after');
                return;
            }

            if (pending.step === 'notes') {
                if (!isValidScore(pending.before)) {
                    pending.step = 'before';
                    savePending();
                    r('before');
                    return;
                }
                if (!isValidScore(pending.after)) {
                    pending.step = 'after';
                    savePending();
                    r('after');
                    return;
                }
                r('notes');
                return;
            }

            pending.step = 'before';
            savePending();
            r('before');
        }

        function goHomeFromCheckin() {
            savePending();
            r('home');
        }

        function backToBefore() {
            pending.step = 'before';
            savePending();
            r('before');
        }

        function backToAfter() {
            pending.step = 'after';
            savePending();
            r('after');
        }

        function doBefore() {
            const slider = document.getElementById('beforeSlider');
            if (!slider) return;
            const value = parseInt(slider.value, 10);
            if (!isValidScore(value)) return;
            pending.before = value;
            pending.step = 'after';
            savePending();
            r('after');
        }

        function doAfter() {
            const slider = document.getElementById('afterSlider');
            if (!slider) return;
            const value = parseInt(slider.value, 10);
            if (!isValidScore(value)) return;
            pending.after = value;
            pending.step = 'notes';
            savePending();
            r('notes');
        }

        function captureNotes() {
            const songEl = document.getElementById('songInput');
            const commentEl = document.getElementById('commentInput');
            const group = document.getElementById('touchGroup');
            if (songEl) pending.song = normalizeString(songEl.value.trim(), 300);
            if (commentEl) pending.comment = normalizeString(commentEl.value.trim(), 5000);
            if (group) pending.touch = Array.from(group.querySelectorAll('.pill.selected')).map(p => p.dataset.touch);
            savePending();
        }

        function doSave() {
            if (isSaving) return;
            captureNotes();
            if (!isValidScore(pending.before) || !isValidScore(pending.after)) {
                showToast('❌ Please complete both stress ratings first.', true);
                return;
            }

            isSaving = true;
            // Re-read the saved dataset immediately before writing so another open tab cannot
            // accidentally be overwritten by this tab's older in-memory copy.
            syncDataFromStorage();

            const created = new Date();
            const entry = {
                id: pending.id || makeId(),
                createdAt: created.toISOString(),
                date: ts(),
                time: now(),
                period: period(),
                before: pending.before,
                after: pending.after,
                song: normalizeString(pending.song.trim(), 300),
                touch: [...new Set(pending.touch)].join(', '),
                comment: normalizeString(pending.comment.trim(), 5000)
            };

            const existing = D.checkins.find(c => c.id === entry.id);
            if (existing) {
                clearPending();
                isSaving = false;
                r('result', { ...existing });
                return;
            }

            D.checkins.push(entry);
            refreshDerivedData();

            if (!save()) {
                D.checkins = D.checkins.filter(c => c.id !== entry.id);
                refreshDerivedData();
                isSaving = false;
                showToast('❌ This check-in could not be saved. Please make a backup and check browser storage.', true);
                return;
            }

            const cleared = clearPending();
            isSaving = false;
            r('result', { ...entry });
            if (!cleared) {
                showToast('⚠️ Check-in saved, but the unfinished draft could not be cleared.', true);
            }
        }

        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && hasPending()) savePending();
        });

        window.addEventListener('pagehide', () => {
            if (hasPending()) savePending();
        });

        window.addEventListener('storage', event => {
            if (event.key === STORAGE_KEY) {
                const latest = readStoredData();
                if (latest) D = latest;
                if (LIVE_DATA_SCREENS.has(currentScreen)) r(currentScreen);
            } else if (event.key === PENDING_KEY && currentScreen === 'home') {
                pending = loadPending();
                r('home');
            }
        });

        r('home');
    </script>
</body>
</html>
