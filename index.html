<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Radiant Road Music · Progress Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f0f15;color:#e8e8f2;display:flex;justify-content:center;padding:0 8px;min-height:100vh}
.app{width:100%;max-width:440px;min-height:100vh;padding:12px 16px 90px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}
.brand-icon{width:44px;height:44px;background:linear-gradient(135deg,#7c5cfc,#a78bfa);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;box-shadow:0 4px 16px rgba(124,92,252,0.35)}
.brand-name{font-size:1.2rem;font-weight:800;letter-spacing:-0.3px}
.brand-sub{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:#9b83ff}
.top-nav{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.top-nav h1{font-size:1.35rem;font-weight:700}
.streak{display:flex;align-items:center;gap:6px;background:rgba(124,92,252,0.15);padding:7px 14px;border-radius:20px;font-size:0.85rem;font-weight:600;color:#9b83ff}
.card{background:#1a1a26;border-radius:18px;padding:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.04)}
.card-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.8px;color:#6b6b80;margin-bottom:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:28px;font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:.2s;width:100%}
.btn-primary{background:#7c5cfc;color:#fff;box-shadow:0 4px 20px rgba(124,92,252,0.3)}
.btn-primary:active{background:#9b83ff;transform:scale(0.97)}
.btn-ghost{background:transparent;color:#9b83ff;padding:8px 12px;font-size:0.85rem;width:auto}
.pill{padding:10px 18px;border-radius:22px;font-size:0.85rem;font-weight:600;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#b0b0c0;cursor:pointer;font-family:inherit;transition:.15s}
.pill.selected{background:rgba(124,92,252,0.15);border-color:rgba(124,92,252,0.3);color:#9b83ff}
.pill-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.input-field,.comment-area{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;color:#e8e8f2;font-family:inherit;font-size:0.88rem;transition:border-color .2s}
.input-field:focus,.comment-area:focus{outline:none;border-color:#7c5cfc}
.comment-area{resize:none;overflow:hidden;min-height:80px;line-height:1.5}
.slider-container{padding:0 8px}
.slider-container input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#4ade80,#a3e635,#fbbf24,#f97316,#f87171);outline:none}
.slider-container input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #7c5cfc;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,0.35)}
.rating-big{font-size:4rem;font-weight:800;height:80px;line-height:80px;color:#9b83ff;text-align:center}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:#1a1a26;border-radius:12px;padding:16px;text-align:center;border:1px solid rgba(255,255,255,0.04)}
.stat-value{font-size:1.5rem;font-weight:700}
.stat-label{font-size:0.7rem;text-transform:uppercase;color:#6b6b80;margin-top:4px;letter-spacing:.5px}
.stat-sub{font-size:0.72rem;color:#9b83ff;margin-top:2px}
.prompt{text-align:center;padding:26px 20px}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mt-8{margin-top:8px}
.text-muted{color:#6b6b80}
.text-sm{font-size:0.78rem}
.text-center{text-align:center}
.flex{display:flex}
.gap-2{gap:8px}
.w-full{width:100%}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='nstrk_data';
let D=JSON.parse(localStorage.getItem(KEY))||{checkins:[],streak:{current:0,lastDate:null,longest:0}};
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function ts(){return new Date().toISOString().split('T')[0]}
function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true})}
function fmtFull(d){return new Date(d+'T00:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}
function per(){const h=new Date().getHours();return h<12?'Morning':h<17?'Afternoon':'Evening'}
function updStreak(t){
  const s=D.streak;
  if(!s.lastDate){s.current=1;s.longest=1;s.lastDate=t;return}
  if(s.lastDate===t)return;
  const d=Math.round((new Date(t+'T00:00:00')-new Date(s.lastDate+'T00:00:00'))/86400000);
  if(d===1){s.current++;if(s.current>s.longest)s.longest=s.current}else if(d>1)s.current=1;
  s.lastDate=t;
}
let screen='home',pen={};

function r(s,d){screen=s;document.getElementById('app').innerHTML=render(s,d)}

function render(s,d){
  const brand=`<div class="brand fade-in"><div class="brand-icon">🎵</div><div><div class="brand-name">Radiant Road Music</div><div class="brand-sub">Progress Tracker</div></div></div>`;
  return brand+body(s,d);
}

function body(s,d){
  switch(s){
    case'home':return home();
    case'before':return before();
    case'after':return after();
    case'notes':return notes(d);
    case'result':return result(d);
    case'dash':return dash();
    case'hist':return hist();
  }
}
function nav(a){return`<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(15,15,21,0.92);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;height:70px;border-top:1px solid rgba(255,255,255,0.06);z-index:100">${['home','dash','hist'].map(p=>`<button style="background:none;border:none;color:${a===p?'#9b83ff':'#6b6b80'};font-size:0.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;font-family:inherit" onclick="r('${p}')">${p==='home'?'🏠':p==='dash'?'📊':'📋'}<span>${p==='home'?'Home':p==='dash'?'Progress':'History'}</span></button>`).join('')}<button style="background:none;border:none;color:${a==='ci'?'#9b83ff':'#6b6b80'};font-size:0.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 14px;font-family:inherit" onclick="start()">✍️<span>Check-in</span></button></div>`}

function home(){
  const t=ts();const s=D.streak;const c=D.checkins.filter(x=>x.date===t).length;
  const e=per()==='Morning'?'🌅':per()==='Afternoon'?'☀️':'🌙';
  return`
  <div class="top-nav"><h1>Progress Tracker</h1><div class="streak">🔥 ${s.current} day streak</div></div>
  <div class="card prompt fade-in">
    <div style="display:inline-block;background:rgba(124,92,252,0.15);color:#9b83ff;padding:5px 13px;border-radius:14px;font-size:0.78rem;font-weight:600;margin-bottom:16px">${e} ${per()} Check-in</div>
    <h2 style="margin-bottom:6px">How are you feeling?</h2>
    <p style="color:#6b6b80;font-size:0.88rem;margin-bottom:20px">Rate your stress before and after your session.</p>
    <button class="btn btn-primary" onclick="start()">Start Check-in</button>
    ${c>0?`<p style="margin-top:12px;font-size:0.8rem;color:#6b6b80">${c} check-in${c>1?'s':''} today so far${c<2?' — aim for at least 2':''}</p>`:''}
  </div>
  <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:14px 16px;text-align:center;color:#6b6b80;font-size:0.8rem">💡 Building lasting calm takes time. Small, consistent sessions build the foundation. Showing up is the win.</div>
  ${nav('home')}`;
}
function start(){pen={};r('before')}
function before(){
  return`
  <div class="top-nav"><button class="btn-ghost btn" style="width:auto" onclick="r('home')">← Back</button><div style="flex:1"></div><span style="font-size:0.78rem;color:#6b6b80">Step 1 of 3</span></div>
  <div class="card text-center fade-in">
    <div style="font-size:0.9rem;font-weight:600;margin-bottom:6px;color:#b0b0c0">How stressed / overwhelmed are you right now?</div>
    <div class="rating-big" id="bv">5</div>
    <div class="slider-container"><input type="range" min="1" max="10" value="5" oninput="document.getElementById('bv').textContent=this.value"></div>
    <div class="flex" style="justify-content:space-between;font-size:0.72rem;color:#6b6b80;margin-top:6px"><span>😌 Calm</span><span>5</span><span>Stressed 😰</span></div>
  </div>
  <button class="btn btn-primary mt-8" onclick="pen.before=+document.getElementById('bv').textContent;r('after')">Continue →</button>
  ${nav('ci')}`;
}
function after(){
  return`
  <div class="top-nav"><button class="btn-ghost btn" style="width:auto" onclick="r('before')">← Back</button><div style="flex:1"></div><span style="font-size:0.78rem;color:#6b6b80">Step 2 of 3</span></div>
  <div class="card text-center" style="margin-bottom:8px;background:rgba(124,92,252,0.15);border:1px solid rgba(124,92,252,0.3)"><span style="font-size:0.78rem;color:#9b83ff">Your stress before: <strong>${pen.before}/10</strong></span></div>
  <div class="card text-center fade-in">
    <div style="font-size:0.9rem;font-weight:600;margin-bottom:6px;color:#b0b0c0">After your session — how stressed are you now?</div>
    <div class="rating-big" id="av">3</div>
    <div class="slider-container"><input type="range" min="1" max="10" value="3" oninput="document.getElementById('av').textContent=this.value"></div>
    <div class="flex" style="justify-content:space-between;font-size:0.72rem;color:#6b6b80;margin-top:6px"><span>😌 Calm</span><span>5</span><span>Stressed 😰</span></div>
  </div>
  <button class="btn btn-primary mt-8" onclick="pen.after=+document.getElementById('av').textContent;r('notes',{})">Continue →</button>
  ${nav('ci')}`;
}
function notes(){
  return`
  <div class="top-nav"><button class="btn-ghost btn" style="width:auto" onclick="r('after')">← Back</button><div style="flex:1"></div><span style="font-size:0.78rem;color:#6b6b80">Step 3 of 3</span></div>
  <div class="card fade-in">
    <div class="card-title">Session Notes <span style="font-weight:400;text-transform:none;color:#6b6b80">(Optional, but highly beneficial)</span></div>
    <label style="font-size:0.78rem;color:#6b6b80;display:block;margin-bottom:6px">What did you listen to?</label>
    <input class="input-field" id="song" placeholder="e.g. I am Safe" style="margin-bottom:16px">
    <label style="font-size:0.78rem;color:#6b6b80;display:block;margin-bottom:6px">Touch techniques used</label>
    <div class="pill-group" id="tg">
      <button class="pill" onclick="this.classList.toggle('selected')">🙌 Hands</button>
      <button class="pill" onclick="this.classList.toggle('selected')">😌 Face</button>
      <button class="pill" onclick="this.classList.toggle('selected')">💪 Arms</button>
      <button class="pill" onclick="this.classList.toggle('selected')">✨ All</button>
    </div>
    <label style="font-size:0.78rem;color:#6b6b80;display:block;margin-bottom:6px">Any notes on how it felt?</label>
    <textarea class="comment-area" id="com" rows="3" placeholder="e.g. Felt tension release in my shoulders. Calmer than usual today." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
  </div>
  <button class="btn btn-primary mt-8" onclick="doSave()">Save Check-in</button>
  <button class="btn-ghost btn" style="margin-top:6px" onclick="doSave()">Skip notes →</button>
  ${nav('ci')}`;
}
function doSave(){
  const song=document.getElementById('song')?.value?.trim()||'';
  const touch=Array.from(document.querySelectorAll('#tg .pill.selected')).map(e=>e.textContent.trim()).join(', ');
  const comment=document.getElementById('com')?.value?.trim()||'';
  const e={id:Date.now()+'',date:ts(),time:now(),period:per(),before:pen.before,after:pen.after,song,touch,comment};
  D.checkins.push(e);updStreak(ts());save();r('result',e);
}
function result(d){
  const r=d.before-d.after;
  let msg,em;
  if(r>=4){msg=`Incredible! You reduced your stress by <strong>${r} points</strong>. That's a big shift — well done 😊`;em='🎉'}
  else if(r>=2){msg=`Well done! You reduced your stress by <strong>${r} points</strong> 😊`;em='🙌'}
  else if(r===1){msg=`Nice one! You reduced your stress by <strong>1 point</strong>. Every shift counts 😊`;em='👍'}
  else{msg='Some days the win is simply showing up. Perhaps another listen with soothing touch may help some more.';em=r<0?'❤️':'💪'}
  return`
  <div class="top-nav"><h1>Check-in Complete</h1></div>
  <div class="card text-center fade-in" style="padding:28px 20px">
    <div style="font-size:3rem;margin-bottom:8px">${em}</div>
    <div class="flex" style="justify-content:center;gap:28px;margin:16px 0">
      <div class="text-center"><div style="font-size:1.5rem;font-weight:700">${d.before}</div><div style="font-size:0.7rem;text-transform:uppercase;color:#6b6b80">Before</div></div>
      <div style="font-size:1.4rem;color:#6b6b80;align-self:center">→</div>
      <div class="text-center"><div style="font-size:1.5rem;font-weight:700">${d.after}</div><div style="font-size:0.7rem;text-transform:uppercase;color:#6b6b80">After</div></div>
    </div>
    ${r>0?`<div style="font-size:2.8rem;font-weight:800;color:#4ade80;margin:8px 0">−${r} points</div>`:'<div style="font-size:2.8rem;font-weight:800;color:#6b6b80">—</div>'}
    <div style="font-size:1rem;color:#b0b0c0;margin-bottom:6px;line-height:1.5">${msg}</div>
    ${d.song?`<p style="font-size:0.78rem;color:#6b6b80;margin-top:6px">🎵 ${d.song}</p>`:''}
    ${d.touch?`<p style="font-size:0.78rem;color:#6b6b80;margin-top:2px">🤲 ${d.touch}</p>`:''}
    ${d.comment?`<p style="font-size:0.78rem;color:#6b6b80;margin-top:2px">💬 ${d.comment}</p>`:''}
    <p style="font-size:0.7rem;color:#6b6b80;margin-top:12px">${fmtFull(ts())} · ${now()}</p>
  </div>
  <button class="btn btn-primary" onclick="r('dash')">See My Progress →</button>
  <button class="btn" style="background:#1a1a26;color:#e8e8f2;border:1px solid rgba(255,255,255,0.08);margin-top:8px" onclick="r('home')">Back to Home</button>
  ${nav('home')}`;
}
function dash(){
  const t=ts(),s=D.streak,a=D.checkins,c=a.filter(x=>x.date===t).length;
  const wk={start:new Date(),end:new Date()};wk.start.setDate(wk.start.getDate()-wk.start.getDay()+1);wk.end=new Date(wk.start);wk.end.setDate(wk.end.getDate()+6);
  const ws=wk.start.toISOString().split('T')[0],we=wk.end.toISOString().split('T')[0];
  const wc=a.filter(x=>x.date>=ws&&x.date<=we);
  const ar=wc.length>0?(wc.reduce((s,x)=>s+(x.before-x.after),0)/wc.length).toFixed(1):'—';
  const tot=a.length;
  return`
  <div class="top-nav"><h1>Your Progress</h1><button class="btn-ghost btn" style="width:auto" onclick="exportCSV()">📤</button><button class="btn-ghost btn" style="width:auto" onclick="backup()">💾</button></div>
  <div class="stat-grid fade-in">
    <div class="stat-card"><div class="stat-value">${s.current}</div><div class="stat-label">Day Streak</div><div class="stat-sub">Best: ${s.longest}</div></div>
    <div class="stat-card"><div class="stat-value">${c}</div><div class="stat-label">Today</div><div class="stat-sub">${c>=2?'✅ On track':'Aim: 2'}</div></div>
    <div class="stat-card"><div class="stat-value">${ar}</div><div class="stat-label">Avg Reduction</div><div class="stat-sub">This week · ${wc.length} entries</div></div>
    <div class="stat-card"><div class="stat-value">${tot}</div><div class="stat-label">Total Check-ins</div><div class="stat-sub">${wc.filter(x=>x.before>x.after).length} improved</div></div>
  </div>
  <div class="reminder" style="background:rgba(255,255,255,0.03);border-radius:12px;padding:14px 16px;text-align:center;color:#6b6b80;font-size:0.8rem;margin-top:12px">💡 Building lasting calm is not linear. Some days you'll feel big shifts — other days, just showing up is the win.</div>
  ${nav('dash')}`;
}
function hist(){
  const l=[...D.checkins].reverse();
  return`
  <div class="top-nav"><button class="btn-ghost btn" style="width:auto" onclick="r('dash')">←</button><div style="flex:1"></div><h1 style="font-size:1.1rem">History</h1></div>
  ${l.length===0?'<div class="text-center" style="padding:32px 20px;color:#6b6b80;font-size:0.88rem">No check-ins yet. Start your first one from home.</div>':''}
  ${l.map((x,i)=>{
    const r=x.before-x.after;
    const n=[x.song,x.touch,x.comment].filter(Boolean).join(' · ');
    const p=l[i+1];
    return`${!p||x.date!==p.date?`<div style="font-size:0.72rem;color:#6b6b80;font-weight:600;padding:8px 4px 4px;text-transform:uppercase;letter-spacing:0.5px">${fmtFull(x.date)}</div>`:''}
    <div class="flex" style="align-items:center;gap:10px;padding:12px 14px;background:#1a1a26;border-radius:12px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.04)">
      <span style="font-size:0.7rem;color:#6b6b80;min-width:52px">${x.time}</span>
      <span style="font-size:0.9rem;font-weight:700">${x.before}</span>
      <span style="color:#6b6b80;font-size:0.75rem">→</span>
      <span style="font-size:0.9rem;font-weight:700">${x.after}</span>
      <span style="font-size:0.75rem;font-weight:700;padding:3px 8px;border-radius:10px;color:${r>0?'#4ade80':r<0?'#f87171':'#6b6b80'};background:${r>0?'rgba(74,222,128,0.15)':r<0?'rgba(248,113,113,0.12)':'rgba(255,255,255,0.05)'}">${r!==0?(r>0?'−':'+')+Math.abs(r):'0'}</span>
      ${n?`<span style="font-size:0.7rem;color:#6b6b80;margin-left:auto;max-width:90px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${n}">${n}</span>`:''}
    </div>`;
  }).join('')}
  ${nav('hist')}`;
}
function exportCSV(){
  const rows=D.checkins.map(c=>[c.date,c.time,c.period,c.before,c.after,c.before-c.after,'"'+c.song+'"','"'+c.touch+'"','"'+c.comment+'"'].join(','));
  const csv='Date,Time,Period,Before,After,Reduction,Song,Touch,Notes\n'+rows.join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tracker.csv';a.click();
  showToast('✅ Exported');
}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='backup.json';a.click();
  showToast('💾 Backup saved');
}
function showToast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;background:#4ade80;color:#000;padding:10px 22px;border-radius:22px;font-size:0.85rem;font-weight:700;box-shadow:0 4px 20px rgba(74,222,128,0.4);animation:fadeIn .3s';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
r('home');
</script>
</body>
</html>
